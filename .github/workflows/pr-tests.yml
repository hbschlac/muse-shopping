name: PR Tests

# Vibe Check action — opened by vibe-improver.
# Closes the gap that produced high "broken in prod" score: prior to this,
# no automated test gate ran on PRs targeting main, so a hotfix-after-merge
# loop was easy to fall into.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/pr-tests.yml"

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type check
        run: npx tsc --noEmit --pretty
        continue-on-error: true # tighten to required once clean

      - name: Tests
        run: npm run test:ci
