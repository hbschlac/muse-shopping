name: Secret scan

# This repo is public. Anything committed is readable by everyone, forever,
# even after it is deleted. This blocks private keys and tokens from landing.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Muse scanner (keys, cloud tokens, credential files)
        run: node scripts/scan-secrets.js --all
      - name: Gitleaks (commits in this push or PR)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
