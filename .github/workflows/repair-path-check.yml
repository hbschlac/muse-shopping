name: Repair path check

# Self-repair PRs (label `extractor-repair`, branch `repair/<store>-...`) may
# auto-merge only when they change exactly one single-store script under
# extractors/scripts/ plus that store's saved test page. This check runs on
# every PR and on every new commit, so a repair PR that grows past that scope
# loses auto-merge and fails. Ordinary PRs pass straight through.
#
# Read-only: it never checks out or runs code from the PR itself.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  paths:
    name: repair-path-check
    runs-on: ubuntu-latest
    outputs:
      auto_merge: ${{ steps.check.outputs.auto_merge }}
    steps:
      - name: Not a repair PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        run: echo "Not a self-repair PR; nothing to check."

      # Rules come from main (the base), never from the PR's own copy.
      - uses: actions/checkout@v4
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        with:
          node-version: 20

      - name: Check changed paths
        id: check
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD"
          node scripts/repair/check-repair-paths.js "$BASE" "$HEAD"

  # Required check: the focused tests plus a live dry run of the repaired
  # store's script. Runs the PR's code, so it gets no secrets and no token
  # permissions. Ordinary PRs pass straight through.
  tests:
    name: repair-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: Not a repair PR
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        run: echo "Not a self-repair PR; nothing to test."
      - uses: actions/checkout@v4
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        with:
          node-version: 20
      - name: Focused tests and live dry run
        if: ${{ contains(github.event.pull_request.labels.*.name, 'extractor-repair') }}
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          store=$(echo "$HEAD_REF" | sed -nE 's#^repair/([a-z0-9][a-z0-9-]*)-run-[0-9]+$#\1#p')
          [ -n "$store" ] || { echo "repair PR branch must be repair/<store>-run-<id>"; exit 1; }
          npm install --ignore-scripts --no-audit --no-fund > /dev/null
          npx jest --testEnvironment=node --runInBand tests/listingWatch tests/repair
          if [ -f "extractors/scripts/$store.js" ]; then
            node scripts/repair/dry-run.js "$store" "$store"
          else
            echo "Store script removed (an undo); the store goes back to the shared script."
          fi

  # If a repair PR stops qualifying, switch auto-merge off so it waits for hannah.
  disarm:
    needs: paths
    if: ${{ always() && contains(github.event.pull_request.labels.*.name, 'extractor-repair') && needs.paths.outputs.auto_merge != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Disable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr merge "$PR" --repo "$REPO" --disable-auto || true
